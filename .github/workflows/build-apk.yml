name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F '.' '{print $1}')
          if [ -z "$MAJOR_VER" ]; then
            echo "ERROR: Could not detect active Java version."
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or newer. Found: $MAJOR_VER"
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Discovered files in app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file is empty: $EXPECTED_APK"
            exit 1
          fi
          echo "APK successfully verified at: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_CLEAN=$(echo "$REPO_RAW" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/^-*//;s/-*$//')
          if [ -z "$REPO_CLEAN" ]; then
            REPO_CLEAN="app"
          fi
          ASSET_NAME="${REPO_CLEAN}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_PATH with name $ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH is missing or empty."
            exit 1
          fi

          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}
          - GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}
          - Note: This APK is intended for testing and is not a Play Store production release.
          - Note: This APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG" "$ASSET_PATH#$ASSET_NAME" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Succeeded ==="
            gh release view "$TAG" || true
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            echo "### 🚀 Debug APK Released Successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK is available for direct download on your phone under GitHub Releases:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [$TITLE ($TAG)]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Asset Name:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "You can download the APK directly from the release Assets section on mobile or desktop." >> "$GITHUB_STEP_SUMMARY"
            echo "Additionally, the standard Actions artifact **\`app-debug-apk\`** is available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing did not succeed."
            echo "The debug APK was successfully built and uploaded as the Actions artifact 'app-debug-apk'."

            echo "### ⚠️ Debug APK Built (Release Publishing Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**The debug APK build and Actions artifact upload succeeded.**" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Release publishing did not complete (check repository release permissions or tags), but the APK is preserved:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact:** \`app-debug-apk\` is available under the workflow run summary." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "You can download \`app-debug-apk\` directly from this GitHub Actions run." >> "$GITHUB_STEP_SUMMARY"
          fi
